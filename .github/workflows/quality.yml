name: Build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build and lint audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The repository currently has legacy ESLint findings in existing feature files.
      # Keep this audit visible, but do not let it prevent the production build check.
      - name: Run ESLint audit
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build production bundle
        run: npm run build
